<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StockPilot Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#16181c; --fg:#e8eaee; --muted:#8d939d;
    --shell:#2a2d32; --shell-hi:#3a3e45; --shell-lo:#17191c;
    --rubber:#1d1f22; --trigger:#f2b81c; --trigger-lo:#b9860a;
    --laser:#ff2a2a;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:radial-gradient(ellipse at 50% 30%, #262a31 0%, var(--bg) 70%);
    color:var(--fg); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif; overflow:hidden; }
  body { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; padding:16px; }

  /* ───── Stage: scales the whole handheld to fit the window ───── */
  .stage { position:relative; width:460px; height:1180px; transform-origin:center; flex:none; }

  /* Laser beam projected out of the top scan window */
  .beam { position:absolute; left:50%; top:0; width:360px; height:186px;
    transform:translateX(-50%) scaleY(0); transform-origin:bottom center; opacity:0; pointer-events:none;
    background:linear-gradient(to top, rgba(255,42,42,.55), rgba(255,42,42,.08) 70%, transparent);
    clip-path:polygon(46% 100%, 54% 100%, 100% 0, 0 0); filter:blur(1px); }
  .beam::after { content:""; position:absolute; left:0; right:0; top:0; height:4px; border-radius:2px;
    background:var(--laser); box-shadow:0 0 12px 3px rgba(255,42,42,.9); animation:none; }
  .stage.scanning .beam { animation:beam .6s ease-out forwards; }
  .stage.scanning .beam::after { animation:sweep .6s linear; }
  @keyframes beam { 0% {opacity:0; transform:translateX(-50%) scaleY(.2);} 25% {opacity:1; transform:translateX(-50%) scaleY(1);}
    80% {opacity:1;} 100% {opacity:0; transform:translateX(-50%) scaleY(1);} }
  @keyframes sweep { 0%,100% {transform:translateY(0);} 50% {transform:translateY(10px);} }

  /* ───── Handheld body ───── */
  .handheld { position:absolute; left:20px; top:170px; width:420px; height:1000px; border-radius:58px 58px 70px 70px;
    background:linear-gradient(160deg, var(--shell-hi) 0%, var(--shell) 35%, #222428 70%, var(--shell-lo) 100%);
    box-shadow: inset 0 2px 1px rgba(255,255,255,.12), inset 0 -3px 6px rgba(0,0,0,.6),
      0 40px 80px rgba(0,0,0,.6), 0 8px 20px rgba(0,0,0,.4);
    animation:arrive .7s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes arrive { from { opacity:0; transform:translateY(40px) scale(.96);} to {opacity:1; transform:none;} }
  .handheld.buzz { animation:buzz .22s linear; }
  @keyframes buzz { 0%,100% {transform:translateX(0);} 20% {transform:translateX(-2px);} 40% {transform:translateX(2px);}
    60% {transform:translateX(-2px);} 80% {transform:translateX(1px);} }

  /* Rubber corner bumpers */
  .bumper { position:absolute; width:92px; height:92px; background:var(--rubber);
    box-shadow: inset 0 1px 1px rgba(255,255,255,.08), inset 0 -2px 4px rgba(0,0,0,.5); }
  .bumper.tl { left:-8px; top:-8px; border-radius:64px 10px 40px 10px; }
  .bumper.tr { right:-8px; top:-8px; border-radius:10px 64px 10px 40px; }
  .bumper.bl { left:-8px; bottom:-8px; border-radius:10px 40px 10px 76px; }
  .bumper.br { right:-8px; bottom:-8px; border-radius:40px 10px 76px 10px; }
  .bumper::after { content:""; position:absolute; inset:18px; border-radius:inherit;
    background:repeating-linear-gradient(45deg, rgba(255,255,255,.035) 0 2px, transparent 2px 6px); }

  /* Top scan window, LED and speaker */
  .scanwin { position:absolute; top:-4px; left:50%; transform:translateX(-50%); width:150px; height:26px;
    border-radius:0 0 14px 14px; background:linear-gradient(#0b0c0e, #24272c); box-shadow: inset 0 2px 6px rgba(0,0,0,.9); }
  .scanwin::after { content:""; position:absolute; left:50%; top:8px; width:46px; height:6px; transform:translateX(-50%);
    border-radius:3px; background:#3a0d0d; transition:background .1s, box-shadow .1s; }
  .stage.scanning .scanwin::after { background:var(--laser); box-shadow:0 0 14px 4px rgba(255,42,42,.8); }

  .led { position:absolute; top:52px; left:68px; width:12px; height:12px; border-radius:50%;
    background:#1a1c1f; box-shadow: inset 0 1px 2px rgba(0,0,0,.8); transition:background .15s, box-shadow .15s; }
  .led.green { background:#30e070; box-shadow:0 0 12px 3px rgba(48,224,112,.7); }
  .led.red { background:#ff4a3a; box-shadow:0 0 12px 3px rgba(255,74,58,.7); }
  .led.amber { background:#ffb020; box-shadow:0 0 12px 3px rgba(255,176,32,.7); }
  .speaker { position:absolute; top:52px; left:50%; transform:translateX(-50%); width:84px; height:10px; border-radius:5px;
    background:repeating-linear-gradient(90deg, #0c0d0f 0 4px, #2b2e33 4px 7px); box-shadow: inset 0 1px 2px rgba(0,0,0,.8); }
  .cam { position:absolute; top:50px; right:70px; width:14px; height:14px; border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #3b4a66 0 20%, #07080a 45%); box-shadow:0 0 0 2px #121316; }

  /* Screen recess */
  .bezel { position:absolute; left:22px; top:92px; width:376px; height:756px; border-radius:20px;
    background:#08090a; box-shadow: inset 0 0 0 1px rgba(255,255,255,.06), 0 1px 0 rgba(255,255,255,.08); }
  .device { position:absolute; left:8px; top:8px; width:360px; height:740px; border-radius:12px; overflow:hidden; background:#fff; }
  .device::after { /* glass glare */ content:""; position:absolute; inset:0; pointer-events:none; border-radius:inherit;
    background:linear-gradient(115deg, rgba(255,255,255,.10) 0%, rgba(255,255,255,0) 28%); }

  .screen { position:absolute; inset:0; transition:transform .32s cubic-bezier(.2,.8,.2,1), opacity .32s ease; }
  .screen img { display:block; width:360px; height:740px; user-select:none; -webkit-user-drag:none; }
  .screen.hidden { opacity:0; pointer-events:none; }
  .screen.left { transform:translateX(-28%); }
  .screen.right { transform:translateX(28%); }

  .hot { position:absolute; cursor:pointer; border-radius:14px; overflow:hidden; -webkit-tap-highlight-color:transparent; }
  body.show-hot .hot, .device.flash .screen:not(.hidden) .hot {
    background:rgba(26,71,230,.18); outline:2px solid rgba(26,71,230,.7); }
  .ripple { position:absolute; border-radius:50%; background:rgba(0,0,0,.14); transform:scale(0); pointer-events:none;
    animation:ripple .45s ease-out forwards; }
  @keyframes ripple { to { transform:scale(1); opacity:0; } }
  .hold-fill { position:absolute; inset:0; background:rgba(255,255,255,.3); transform-origin:left; transform:scaleX(0); pointer-events:none; }

  /* Front keypad below the screen */
  .keys { position:absolute; left:0; right:0; top:872px; display:flex; justify-content:center; align-items:center; gap:22px; }
  .key { border:none; cursor:pointer; font:600 12px/1 inherit; letter-spacing:.08em; color:#c9ccd2;
    background:linear-gradient(#3a3e45, #26292e); box-shadow:0 3px 0 #111214, inset 0 1px 0 rgba(255,255,255,.12);
    transition:transform .08s, box-shadow .08s; }
  .key:active, .key.pressed { transform:translateY(3px); box-shadow:0 0 0 #111214, inset 0 1px 0 rgba(255,255,255,.08); }
  .key.side { width:70px; height:44px; border-radius:14px; font-size:18px; }
  .key.scan { width:150px; height:64px; border-radius:22px; color:#2a1d00; font-size:14px;
    background:linear-gradient(#ffd04a, var(--trigger)); box-shadow:0 4px 0 var(--trigger-lo), inset 0 1px 0 rgba(255,255,255,.5); }
  .key.scan:active, .key.scan.pressed { box-shadow:0 0 0 var(--trigger-lo), inset 0 1px 0 rgba(255,255,255,.4); }
  .key.scan svg { vertical-align:-4px; margin-right:6px; }

  .charge { position:absolute; bottom:22px; left:50%; transform:translateX(-50%); display:flex; gap:10px; }
  .charge i { width:14px; height:5px; border-radius:2px; background:linear-gradient(#c8a24a, #7d6326); }

  /* Side scan triggers + power/volume */
  .trigger { position:absolute; top:420px; width:16px; height:120px; border:none; cursor:pointer; padding:0;
    background:linear-gradient(90deg, var(--trigger-lo), var(--trigger) 60%, #ffd75e); transition:transform .08s; }
  .trigger.l { left:4px; border-radius:8px 3px 3px 8px; }
  .trigger.r { right:4px; border-radius:3px 8px 8px 3px; transform:scaleX(-1); }
  .trigger.l:active, .trigger.l.pressed { transform:translateX(4px); }
  .trigger.r:active, .trigger.r.pressed { transform:scaleX(-1) translateX(4px); }
  .sidebtn { position:absolute; right:6px; width:10px; border-radius:3px 6px 6px 3px; background:linear-gradient(90deg,#1a1c1f,#3a3e45); }

  .controls { display:flex; gap:10px; align-items:center; font-size:13px; color:var(--muted); flex:none; }
  .controls button { font:inherit; color:var(--fg); background:#2a2d34; border:1px solid #3a3e47;
    border-radius:8px; padding:6px 12px; cursor:pointer; }
  .controls button:hover { background:#343843; }
  .step { min-width:180px; text-align:center; }
  .hint { font-size:12px; color:#6c727c; flex:none; max-width:520px; text-align:center; line-height:1.9; }
  .hint kbd { font:inherit; background:#2a2d34; border:1px solid #3a3e47; border-radius:4px; padding:1px 5px; color:#c9ccd2; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration:.01ms !important; transition-duration:.01ms !important; }
  }

  /* ───── Live UI layered over the exported screens (design px) ───── */
  .ov { position:absolute; background:#fff; color:#0a0a0a; font-family:Inter, system-ui, sans-serif;
    font-feature-settings:"tnum" 0; -webkit-font-smoothing:antialiased; white-space:nowrap; }
  .ov.nobg { background:transparent; }
  .clickable { cursor:pointer; }

  /* Count bin fields */
  .field { border-radius:12px; border:1px solid #e5e5e5; background:#fff; padding-left:15px;
    font-weight:500; font-size:32px; line-height:62px; color:#0a0a0a; cursor:pointer;
    transition:background .15s, border-color .15s, color .15s; }
  .field.focus { border:2px solid #1447e6; background:#edf1fd; color:#1447e6; padding-left:15px; line-height:60px; }
  .caret { display:none; width:2px; height:28px; background:#1447e6; vertical-align:-3px; margin-left:1px;
    animation:blink 1s steps(1) infinite; }
  .field.focus .caret { display:inline-block; }
  @keyframes blink { 50% { opacity:0; } }
  .total { background:#f5f5f5; text-align:right; padding-right:16px; }
  .total b { font-weight:700; font-size:36px; letter-spacing:-.5px; display:inline-block; position:relative; top:1px; }
  .total span { font-weight:600; font-size:16px; margin-left:5px; }
  .bump { animation:bump .18s ease-out; }
  @keyframes bump { 50% { transform:scale(1.06); } }

  /* Review / send numbers */
  .big { color:#e7000b; font-weight:700; font-size:54px; }
  .big-label { font-weight:600; font-size:20px; margin-left:12px; }
  .flip { transition:transform .3s ease; }

  /* Reason cards */
  .cards { overflow-y:auto; scrollbar-width:none; padding:8px 0 16px; }
  .cards::-webkit-scrollbar { display:none; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .card { border:1px solid #e5e5e5; border-radius:12px; padding:12px 14px 14px; background:#fff; cursor:pointer;
    white-space:normal; transition:background .15s, border-color .15s, transform .1s; }
  .card:active { transform:scale(.98); }
  .card.wide { grid-column:1 / -1; }
  .card .tile { width:40px; height:40px; border-radius:8px; background:#f4f4f5; display:grid; place-items:center;
    margin-bottom:8px; transition:background .15s; }
  .card .tile svg { width:24px; height:24px; stroke:#0a0a0a; }
  .card .tile svg * { fill:none; transition:fill .15s, stroke .15s; }
  .card h4 { margin:0 0 1px; font-size:16px; line-height:22px; font-weight:600; letter-spacing:-.1px; }
  .card p { margin:0; font-size:13px; line-height:19px; color:#737373; }
  .card.sel { border:2px solid #1447e6; background:#ecf0fd; padding:11px 13px 13px; }
  .card.sel .tile { background:#ced8f9; }
  .card.sel .tile svg { stroke:#1447e6; }
  .card.sel .tile svg .f { fill:#1447e6; }
  .card.sel .tile svg .fs { fill:#1447e6; stroke:#fff; }
  .card.sel .tile svg .d { stroke:#fff; }
  .shake { animation:shake .35s ease; }
  @keyframes shake { 20%,60% { transform:translateX(-6px); } 40%,80% { transform:translateX(6px); } }

  /* Check digits */
  .cdbox { position:absolute; top:6px; width:56px; height:64px; border-radius:10px; background:#f4f4f5;
    display:grid; place-items:center; font-weight:600; font-size:28px; transition:border-color .15s, background .15s; }
  .cdbox.focus { border:2px solid #0a0a0a; }
  .cdbox.bad { border:2px solid #e7000b; background:#fce0e1; }
  .cdbox.good { border:2px solid #00a63e; background:#dcfce7; }
  .cdbox.pop { animation:bump .18s ease-out; }

  /* Next bin status */
  .status { display:flex; align-items:center; justify-content:flex-end; gap:7px; font-weight:600; font-size:14px; }
  .status i { width:8px; height:8px; border-radius:50%; background:#f06c25; }
  .status.ok i { background:#00a63e; }
  .status.ok { animation:bump .3s ease-out; }
  .status:not(.ok) i { animation:pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow:0 0 0 4px rgba(240,108,37,.25); } }

  /* Snackbar */
  .snack { position:absolute; left:16px; right:16px; top:76px; z-index:20; background:#fff; color:#0a0a0a;
    border:1px solid #e5e5e5; box-shadow:0 8px 24px rgba(10,10,10,.10); border-radius:12px; padding:13px 16px; font:500 14px/20px Inter, system-ui, sans-serif; display:flex; gap:10px;
    align-items:center; transform:translateY(-14px); opacity:0; transition:transform .25s ease, opacity .25s ease; pointer-events:none; }
  .snack.on { transform:none; opacity:1; }
  .snack svg { flex:none; }

  .crop { position:absolute; background-repeat:no-repeat; }
  .btn-primary { left:16px; top:624px; width:328px; height:56px; border-radius:16px; background:#1447e6; color:#fff;
    font:500 16px/56px Inter; text-align:center; transition:opacity .15s; }
  .btn-primary.off { opacity:.4; }

  /* Scan bin: aim → scanned is one screen so the label can animate between the two states */
  .scanscreen { position:absolute; inset:0; background:#fff; font-family:Inter, system-ui, sans-serif; color:#0a0a0a; overflow:hidden; }
  .label { position:absolute; left:16px; top:228px; width:328px; height:113px; border-radius:12px; background:#fff;
    border:1px solid #e5e5e5; transition:transform .45s cubic-bezier(.2,.8,.2,1), border-color .3s, box-shadow .45s; }
  .label .bars { position:absolute; left:15px; top:16px; width:221px; height:52px; display:flex; justify-content:space-between; }
  .label .bars i { display:block; height:100%; background:#0a0a0a; transition:background .35s; }
  .label .code { position:absolute; left:15px; width:221px; top:70px; text-align:center; font:700 22px/26px Inter; letter-spacing:.2px; transition:color .35s; }
  .label .chk { position:absolute; left:251px; top:27px; width:59px; height:58px; border:2px solid #0a0a0a; border-radius:9px;
    display:grid; place-items:center; font:700 25px Inter; transition:color .35s, border-color .35s; }
  .laser { position:absolute; left:-8px; right:-8px; top:56px; height:2px; background:#ff2020;
    box-shadow:0 0 6px 1px rgba(255,32,32,.7); animation:aim 1.8s ease-in-out infinite alternate, flicker .12s steps(2) infinite; transition:opacity .2s; }
  @keyframes aim { from { transform:translateY(-34px); } to { transform:translateY(22px); } }
  @keyframes flicker { 50% { opacity:.82; } }
  .label .ok { position:absolute; left:136px; top:26px; width:56px; height:56px; border-radius:50%; background:#00a63e;
    display:grid; place-items:center; transform:scale(0); opacity:0; }
  .scan-h { position:absolute; left:0; width:360px; text-align:center; transition:opacity .25s, transform .35s cubic-bezier(.2,.8,.2,1); }
  .scan-h h2 { margin:0; font:700 22px/28px Inter; letter-spacing:-.3px; }
  .scan-h p { margin:8px 0 0; font:400 15px/22px Inter; color:#737373; }
  .scan-h b { font-weight:400; color:#0a0a0a; }
  .scan-h .yel { display:inline-block; background:#f2b81c; color:#0a0a0a; font-weight:600; border-radius:4px; padding:0 6px; line-height:20px; }
  .btn-secondary { left:16px; top:624px; width:328px; height:56px; border-radius:16px; background:#f4f4f5; color:#0a0a0a;
    font:500 16px/56px Inter; text-align:center; transition:opacity .25s; }
  .s-aim { top:376px; }
  .s-done { top:414px; opacity:0; transform:translateY(12px); }

  .scanscreen.locking .laser { animation:none; transform:translateY(0); height:3px; box-shadow:0 0 12px 3px rgba(255,32,32,.9); }
  .scanscreen.done .laser { animation:none; opacity:0; }
  .scanscreen.done .label { transform:translateY(40px);
    box-shadow:0 0 0 8px #dcf5e4, 0 0 26px 10px rgba(0,166,62,.18); border-color:#fff; }
  .scanscreen.done .bars i { background:#e0e0e0; }
  .scanscreen.done .code { color:#e0e0e0; }
  .scanscreen.done .chk { color:#e0e0e0; border-color:#e0e0e0; }
  .scanscreen.done .ok { animation:pop .45s .12s cubic-bezier(.2,1.6,.4,1) forwards; }
  @keyframes pop { from { transform:scale(0); opacity:0; } to { transform:scale(1); opacity:1; } }
  .scanscreen.done .s-aim { opacity:0; transform:translateY(-10px); }
  .scanscreen.done .s-done { opacity:1; transform:none; transition-delay:.12s; }
  .scanscreen .btn-primary { top:564px; display:flex; align-items:center; justify-content:center; gap:8px; transition:opacity .25s, filter .15s; }
  .scanscreen.locking .btn-primary { filter:brightness(.85); }
  .scanscreen.done .btn-secondary, .scanscreen.done .btn-primary { opacity:0; }
  .scanscreen.done .s-done h2 { animation:none; }
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="beam"></div>
  <div class="handheld" id="handheld">
    <div class="bumper tl"></div><div class="bumper tr"></div><div class="bumper bl"></div><div class="bumper br"></div>
    <div class="scanwin"></div>
    <div class="led" id="led"></div>
    <div class="speaker"></div>
    <div class="cam"></div>

    <button class="trigger l" data-scan aria-label="Left scan trigger"></button>
    <button class="trigger r" data-scan aria-label="Right scan trigger"></button>
    <div class="sidebtn" style="top:200px;height:70px"></div>
    <div class="sidebtn" style="top:290px;height:44px"></div>

    <div class="bezel"><div class="device" id="device"></div></div>

    <div class="keys">
      <button class="key side" id="hwBack" aria-label="Back">&#8592;</button>
      <button class="key scan" data-scan aria-label="Scan">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <path d="M4 8V5h3M17 5h3v3M20 16v3h-3M7 19H4v-3M8 9v6M11 9v6M14 9v6M17 9v6"/></svg>SCAN
      </button>
      <button class="key side" id="hwHome" aria-label="Restart">&#8962;</button>
    </div>
    <div class="charge"><i></i><i></i><i></i></div>
  </div>
</div>

<div class="controls">
  <button id="restart">Restart</button>
  <span class="step" id="step"></span>
  <button id="toggle">Show hotspots (H)</button>
  <label style="display:flex;gap:6px;align-items:center;cursor:pointer"><input type="checkbox" id="damaged"> Unreadable label</label>
</div>
<div class="hint">Yellow keys scan · <kbd>Space</kbd> scan · type digits on your keyboard · <kbd>Tab</kbd> switch field · <kbd>Enter</kbd> confirm · Tick <b>Unreadable label</b> to see the failed-scan path · Check digits <kbd>47</kbd></div>

<script>
// Screens are the exported designs; live values are drawn on top of them in design px (360×740).
const BACK = [6, 36, 44, 72];
const BTN1 = [16, 564, 344, 620];   // primary button
const BTN2 = [16, 624, 344, 680];   // secondary button
const COLS = [[16, 120], [128, 232], [240, 344]];
// Keypad grid → hotspots. rows = top y of each key row (keys are 52px tall)
const keypad = (rows, onKey) => {
  const labels = ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'clear', '0', 'del'];
  return labels.map((k, i) => {
    const [x1, x2] = COLS[i % 3], y = rows[Math.floor(i / 3)];
    return { r: [x1, y, x2, y + 52], fn: () => onKey(k) };
  });
};

const SYSTEM = 120, PACK = 12, TOLERANCE = 12, BIN = '14-C-03', CHECK = '47';
const BINS = { '14-C-03': { check: '47' }, '14-C-04': { check: '82' } };
// Deterministic barcode bar widths (px) so the label looks the same every time
const BARS = (() => { let x = 7, out = []; for (let i = 0; i < 62; i++) { x = (x * 37 + 11) % 97; out.push(x % 5 === 0 ? 3 : x % 3 === 0 ? 2 : 1.5); } return out; })();
// Icons are outlines; when a card is selected .f parts fill, .fs parts fill with white seams, .d details turn white

const START = 'start';
const stage = document.getElementById('stage');
const handheld = document.getElementById('handheld');
const device = document.getElementById('device');
const led = document.getElementById('led');
const stepEl = document.getElementById('step');
const $ = id => document.getElementById(id);
const els = {};
const trail = [];
let current = null;

for (const [id, s] of Object.entries(screens)) {
  const el = document.createElement('div');
  el.className = 'screen hidden right';
  if (s.img) {
    const img = new Image();
    img.src = encodeURI(s.img);
    img.alt = s.label;
    el.appendChild(img);
  }
  if (s.ov) el.insertAdjacentHTML('beforeend', s.ov);
  for (const h of s.hot) {
    const [x1, y1, x2, y2] = h.r;
    const a = document.createElement('div');
    a.className = 'hot';
    Object.assign(a.style, { left: x1 + 'px', top: y1 + 'px', width: (x2 - x1) + 'px', height: (y2 - y1) + 'px' });
    a.addEventListener('pointerdown', e => ripple(a, e));
    if (h.hold) bindHold(a, h);
    else a.addEventListener('click', e => {
      e.stopPropagation();
      if (h.scan) scan();
      else if (h.back) goBack();
      else h.fn();
    });
    el.appendChild(a);
  }
  device.appendChild(el);
  els[id] = el;
}
device.insertAdjacentHTML('beforeend', '<div class="snack" id="snack"></div>');

// Field focus, reason cards
document.querySelectorAll('.field').forEach(f => f.addEventListener('click', e => {
  e.stopPropagation(); S.focus = f.dataset.f; render();
}));
document.querySelectorAll('.card').forEach(c => c.addEventListener('click', e => {
  e.stopPropagation(); S.reason = c.dataset.reason; render();
}));

// ───── Behaviour ─────
function countKey(k) {
  const f = S.focus;
  if (k === 'clear') { S.cases = ''; S.loose = ''; S.focus = 'cases'; }
  else if (k === 'del') S[f] = S[f].slice(0, -1);
  else if (S[f].length < 3) S[f] = (S[f] === '0' ? '' : S[f]) + k;
  else return nope();
  render(true);
}

function confirmCount() {
  if (S.cases === '' && S.loose === '') { shake($('fCases')); shake($('fLoose')); return nope(); }
  S.counted = total();
  S.reason = null;
  if (Math.abs(diff()) <= TOLERANCE) { good(); go('success'); }
  else go('review');
}

function checkDigitKey(k) {
  if (S.cdState) return;
  if (k === 'clear') S.cd = '';
  else if (k === 'del') S.cd = S.cd.slice(0, -1);
  else if (S.cd.length < 2) S.cd += k;
  render();
  if (S.cd.length === 2) {
    const ok = S.cd === CHECK;
    S.cdState = ok ? 'good' : 'bad';
    render();
    if (ok) { good(); setTimeout(() => { S.cdState = ''; go('count'); }, 450); }
    else {
      nope(); shake($('cd0').parentElement);
      setTimeout(() => { S.cd = ''; S.cdState = ''; render(); toast(`Doesn’t match ${BIN}. Check the large digits on the label.`, 'warn'); }, 500);
    }
  }
}

function needReason() {
  if (S.reason) return true;
  shake($('cards')); nope(); toast('Pick a reason to continue', 'warn');
  return false;
}

let approveTimer;
function submit() {
  S.status = 'waiting';
  clearTimeout(approveTimer);
  good();
  go('nextBin');
  toast('Sent to Ravi Kumar. Keep counting.');
  approveTimer = setTimeout(() => {   // supervisor responds while Meena keeps working
    if (S.status !== 'waiting') return;
    S.status = 'approved'; render();
    flashLed('green', 700); buzz();
    toast(`Ravi Kumar approved ${BIN}`);
  }, 8000);
}

// ───── Render live values ─────
let lastTotal = null;
function render(typed) {
  // Count bin
  const fieldHtml = f => {
    const v = S[f], focus = S.focus === f;
    return (v === '' ? (focus ? '' : '0') : v) + '<i class="caret"></i>';
  };
  $('fCases').innerHTML = fieldHtml('cases');
  $('fLoose').innerHTML = fieldHtml('loose');
  $('fCases').classList.toggle('focus', S.focus === 'cases');
  $('fLoose').classList.toggle('focus', S.focus === 'loose');
  const t = total();
  $('total').innerHTML = `<b>${t}</b><span>units</span>`;
  if (typed && t !== lastTotal) bump($('total').querySelector('b'));
  lastTotal = t;

  // Check digits
  [0, 1].forEach(i => {
    const b = $('cd' + i);
    b.textContent = S.cd[i] || '';
    b.className = 'cdbox' + (S.cdState ? ' ' + S.cdState : (i === S.cd.length ? ' focus' : ''));
  });
  $('cdq').textContent = (S.cd[0] || '?') + (S.cd[1] || '?');
  $('cdq').style.color = S.cd ? '#0a0a0a' : '#afafaf';

  if (S.counted === null) return;
  const d = Math.abs(diff()), word = more() ? 'more' : 'less';

  // Success
  $('sTitle').textContent = diff() === 0 ? 'Matches' : 'Within allowed gap';
  $('sSub').innerHTML = `<span style="color:#0a0a0a">${BIN}</span> · ${S.counted} units`;

  // Review
  $('rArrow').style.transform = more() ? 'rotate(180deg)' : '';
  $('rLabel').textContent = `units ${word}`;
  $('rCounted').textContent = S.counted;

  // Reason
  $('reLess').textContent = `${d} units ${word}`;
  document.querySelectorAll('.card').forEach(c => c.classList.toggle('sel', c.dataset.reason === S.reason));
  document.querySelector('[data-reason="none"] p').textContent = `Nothing unusual; simply counted ${more() ? 'more' : 'fewer'} units.`;

  // Send
  $('sdDiff').textContent = (more() ? '+' : '-') + d;
  $('sdLabel').textContent = `units ${word}`;
  $('sdCounted').textContent = S.counted;
  $('sdReason').textContent = (REASONS.find(r => r.id === S.reason) || {}).t || '';

  // Next bin
  $('nbClear').style.display = S.status ? 'none' : 'block';
  $('nbText').style.display = $('nbStatus').style.display = S.status ? 'block' : 'none';
  $('nbStatus').style.display = S.status ? 'flex' : 'none';
  $('nbText').textContent = `${BIN} · ${d} units ${more() ? 'over' : 'short'}`;
  $('nbStatus').className = 'ov status' + (S.status === 'approved' ? ' ok' : '');
  $('nbStatus').innerHTML = `<i></i>${S.status === 'approved' ? 'Approved' : 'Waiting'}`;
}

// Count up the gap on arrival so the size of the mismatch registers
function countUp(el, to, prefix = '') {
  const t0 = performance.now(), dur = 450;
  const step = now => {
    const p = Math.min(1, (now - t0) / dur);
    el.textContent = prefix + Math.round(to * (1 - Math.pow(1 - p, 3)));
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

// ───── Navigation ─────
function go(id, back = false) {
  if (id === current) return;
  if (current === 'scan') { scanTimers.forEach(clearTimeout); scanTimers = []; scanning = false; }   // leaving mid-scan cancels it
  if (id === START && back) { S = fresh(); clearTimeout(approveTimer); }
  const prev = els[current], next = els[id];
  if (prev) prev.classList.add('hidden', back ? 'right' : 'left');
  if (id === START) trail.length = 0;
  else if (!back && current && current !== 'scan') trail.push(current);   // the scan screen is transient
  next.classList.remove('right', 'left');
  next.classList.add(back ? 'left' : 'right');
  void next.offsetWidth;
  next.classList.remove('hidden', 'left', 'right');
  current = id;
  stepEl.textContent = screens[id].label;
  render();
  if (id === 'review') countUp($('rDiff'), Math.abs(diff()));
  if (id === 'send') countUp($('sdDiff'), Math.abs(diff()), more() ? '+' : '-');
  if (id === 'reason') $('cards').scrollTop = 0;
}
function goBack() {
  const prev = trail.pop();
  if (!prev) return nope();
  go(prev, true);
}

// ───── Feedback ─────
function ripple(a, e) {
  const r = a.getBoundingClientRect();
  const k = r.width / a.offsetWidth;
  const size = Math.max(a.offsetWidth, a.offsetHeight) * 2;
  const s = document.createElement('span');
  s.className = 'ripple';
  Object.assign(s.style, { width: size + 'px', height: size + 'px',
    left: ((e.clientX - r.left) / k - size / 2) + 'px', top: ((e.clientY - r.top) / k - size / 2) + 'px' });
  a.appendChild(s);
  setTimeout(() => s.remove(), 500);
}
function bindHold(a, h) {
  const fill = document.createElement('div');
  fill.className = 'hold-fill';
  a.appendChild(fill);
  let timer = null;
  const start = e => {
    e.preventDefault(); e.stopPropagation();
    if (h.guard && !h.guard()) return;
    fill.style.transition = `transform ${h.hold}ms linear`;
    fill.style.transform = 'scaleX(1)';
    timer = setTimeout(() => { reset(); h.fn(); }, h.hold);
  };
  const reset = () => {
    clearTimeout(timer); timer = null;
    fill.style.transition = 'transform .15s ease-out';
    fill.style.transform = 'scaleX(0)';
  };
  a.addEventListener('pointerdown', start);
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(t => a.addEventListener(t, reset));
  a.addEventListener('click', e => e.stopPropagation());
}
const restartAnim = (el, cls) => { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };
const shake = el => restartAnim(el, 'shake');
const bump = el => el && restartAnim(el, 'bump');
let ledTimer;
function flashLed(color, ms) {
  clearTimeout(ledTimer);
  led.className = 'led ' + color;
  ledTimer = setTimeout(() => (led.className = 'led'), ms);
}
function buzz() { restartAnim(handheld, 'buzz'); try { navigator.vibrate && navigator.vibrate(60); } catch (_) {} }
function good() { flashLed('green', 500); buzz(); }
function nope() { flashLed('amber', 400); }
let toastTimer;
function toast(msg, kind) {
  const el = $('snack');
  const icon = kind === 'warn'
    ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f06c25" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>'
    : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#00a63e" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';
  el.innerHTML = icon + '<span>' + msg + '</span>';
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('on'), 2600);
}

// Open the aim screen for a bin label
function aim(bin) {
  S.scanBin = bin;
  const el = $('scanScreen');
  el.classList.remove('locking', 'done');
  $('lblCode').textContent = bin;
  $('lblChk').textContent = BINS[bin].check;
  $('aimBin').textContent = bin;
  $('doneTitle').textContent = `${bin} scanned`;
  go('scan');
}

// Hardware trigger: fires the laser; what it reads depends on the screen
let scanning = false, scanTimers = [];
const later = (fn, ms) => scanTimers.push(setTimeout(fn, ms));
function scan() {
  if (scanning) return;
  const aimable = { start: BIN, nextBin: '14-C-04', scanFailed: S.scanBin, checkDigits: S.scanBin }[current];
  if (current === 'success') { fireLaser(); good(); return go('nextBin'); }
  if (aimable) { aim(aimable); later(scan, 380); return; }
  if (current !== 'scan') { fireLaser(); return setTimeout(nope, 600); }   // nothing to scan here

  scanning = true;
  const el = $('scanScreen');
  fireLaser();
  el.classList.add('locking');
  const unreadable = $('damaged').checked;
  later(() => {
    el.classList.remove('locking');
    if (unreadable) {
      $('damaged').checked = false;   // the retry reads fine
      scanning = false;
      flashLed('red', 700); buzz();
      return go('scanFailed');
    }
    el.classList.add('done');
    good();
    later(() => {
      scanning = false;
      if (S.scanBin === '14-C-04') { go(START, true); toast('End of demo. Back to 14-C-03.'); return; }
      S.cases = ''; S.loose = ''; S.focus = 'cases';
      go('count');
    }, 1500);
  }, 550);
}
function fireLaser() {
  restartAnim(stage, 'scanning');
  flashLed('red', 600);
  setTimeout(() => stage.classList.remove('scanning'), 600);
}

function pressFx(btn) { btn.classList.add('pressed'); setTimeout(() => btn.classList.remove('pressed'), 120); }
document.querySelectorAll('[data-scan]').forEach(b => b.addEventListener('click', () => scan()));
$('hwBack').onclick = goBack;
$('hwHome').onclick = () => go(START, true);

// Tapping a non-interactive area briefly reveals the hotspots, like Figma prototypes
device.addEventListener('click', () => {
  device.classList.add('flash');
  setTimeout(() => device.classList.remove('flash'), 350);
});

$('restart').onclick = () => go(START, true);
const toggle = () => document.body.classList.toggle('show-hot');
$('toggle').onclick = toggle;
document.addEventListener('keydown', e => {
  if (e.key === 'h' || e.key === 'H') return toggle();
  if (e.key === 'r' || e.key === 'R') return go(START, true);
  if (e.code === 'Space') { e.preventDefault(); pressFx(document.querySelector('.key.scan')); return scan(); }
  // Physical keyboard mirrors the on-screen keypads
  const k = /^[0-9]$/.test(e.key) ? e.key : e.key === 'Backspace' ? 'del' : null;
  if (current === 'count') {
    if (k) countKey(k);
    if (e.key === 'Tab') { e.preventDefault(); S.focus = S.focus === 'cases' ? 'loose' : 'cases'; render(); }
    if (e.key === 'Enter') confirmCount();
  }
  if (current === 'checkDigits' && k) checkDigitKey(k);
});

// Scale the handheld to fit the window without altering the design
function fit() {
  const s = Math.min(1, (innerHeight - 130) / 1180, (innerWidth - 32) / 460);
  stage.style.transform = `scale(${s})`;
  stage.style.margin = `${(1180 * (s - 1)) / 2}px ${(460 * (s - 1)) / 2}px`;
}
addEventListener('resize', fit);
fit();

go(START);
</script>
